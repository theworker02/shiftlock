<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ShiftLock mark">
  <title>ShiftLock Mark</title>
  <defs>
    <linearGradient id="shiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27C2D1"/>
      <stop offset="100%" stop-color="#2D72E8"/>
    </linearGradient>
  </defs>
  <!-- Shield body -->
  <path fill="#0A1830" d="M64 8 L108 28 V64 C108 92 90 112 64 120 C38 112 20 92 20 64 V28 Z"/>
  <!-- Shifted interlocking bars (handoff) -->
  <rect x="34" y="44" width="36" height="14" rx="3" fill="url(#shiftGrad)"/>
  <rect x="58" y="62" width="36" height="14" rx="3" fill="#0B8F8C"/>
  <!-- Lock shackle -->
  <path fill="none" stroke="#27C2D1" stroke-width="8" stroke-linecap="round"
        d="M48 44 V34 C48 24 56 18 64 18 C72 18 80 24 80 34 V44"/>
  <!-- Keyhole -->
  <circle cx="64" cy="78" r="7" fill="#F4FAFC"/>
  <rect x="60" y="78" width="8" height="14" rx="2" fill="#F4FAFC"/>
</svg>
