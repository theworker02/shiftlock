services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: shiftlock
      POSTGRES_USER: shiftlock
      POSTGRES_DB: shiftlock
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  # Optional: toxiproxy can be added for partition/latency injection.
