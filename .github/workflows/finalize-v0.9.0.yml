name: Finalize ShiftLock v0.9.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v0.9.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify source and record diagnostics
        id: verify
        shell: bash
        run: |
          set +e
          {
            echo '$ go version'
            go version
            echo '$ gofmt -l .'
            UNFORMATTED=$(gofmt -l .)
            printf '%s\n' "$UNFORMATTED"
            test -z "$UNFORMATTED"
            echo '$ go test ./...'
            go test ./...
            echo '$ go test -race ./...'
            go test -race ./...
            echo '$ go vet ./...'
            go vet ./...
          } > validation.log 2>&1
          STATUS=$?
          set -e
          cat validation.log
          if [ "$STATUS" -ne 0 ]; then
            mkdir -p .release-status
            cp validation.log .release-status/v0.9.0-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm -f .github/workflows/finalize-v0.9.0.yml
            git add -A
            git commit -m "Record ShiftLock v0.9.0 validation failure"
            git push origin HEAD:main
            exit "$STATUS"
          fi
      - name: Remove one-time workflow and tag clean source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-v0.9.0.yml
          rm -f .release-status/v0.9.0-failure.txt
          git add -A
          git commit -m "Prepare ShiftLock v0.9.0 release"
          git push origin HEAD:main
          git tag -a v0.9.0 -m "ShiftLock v0.9.0"
          git push origin v0.9.0
      - name: Build inspector archives
        run: |
          set -euo pipefail
          mkdir -p dist stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            rm -rf stage/*
            NAME=shiftlock-inspect
            if [ "$GOOS" = windows ]; then NAME=shiftlock-inspect.exe; fi
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" -o "stage/$NAME" ./cmd/shiftlock-inspect
            BASE="shiftlock-inspect_0.9.0_${GOOS}_${GOARCH}"
            if [ "$GOOS" = windows ]; then
              (cd stage && zip -q "../dist/${BASE}.zip" "$NAME")
            else
              tar -czf "dist/${BASE}.tar.gz" -C stage "$NAME"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.0 dist/* \
            --verify-tag \
            --title "ShiftLock v0.9.0" \
            --notes-file docs/releases/v0.9.0.md
