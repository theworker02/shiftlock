name: Feature request
description: Propose an API or backend enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: How does this interact with fencing tokens / single-owner invariants?
